name: Compatibility issue
description: Let us know about a bug that occurs when another mod is installed
title: '<title>'
labels: compat
assignees: []
body:
- type: markdown
  attributes:
    value: |
      **Eureka Armada is Fabric only**, and needs the matching Valkyrien Skies 2 build from
      [Eminai-LeoVinci/VS2](https://github.com/Eminai-LeoVinci/VS2).

      **Please don't report these:**
      - **OptiFine** — it replaces the chunk renderer, and so does Sodium, which VS2 requires. They cannot coexist.
      - **Eureka! Ships!** — Armada replaces it and shares its mod id. Running both is not supported.
      - Mods with no build for the Minecraft version you are on.
- type: input
  attributes:
    label: Mod Name
    description: The name and version of the mod that causes the compatibility issue
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Before reporting
    options:
      - label: I am using the matching Valkyrien Skies 2 build from Eminai-LeoVinci/VS2, not the official release
        required: true
      - label: I have tested with only Valkyrien Skies 2, Eureka Armada and the mod named above installed
        required: true
- type: dropdown
  attributes:
    label: Minecraft Version
    description: What Minecraft version does this issue occur on?
    options:
      - 1.20.1
      - 1.21.1
      - 1.21.11
  validations:
    required: true
- type: input
  attributes:
    label: Eureka Armada version
    description: The version shown in your mod list, e.g. 0.1.1-prealpha
  validations:
    required: true
- type: input
  attributes:
    label: Valkyrien Skies 2 version
    description: The version shown in your mod list, e.g. 3.3.1
  validations:
    required: true
- type: textarea
  attributes:
    label: Issue description
    description: Describe what happens, and what you expect to happen instead
  validations:
    required: true
- type: textarea
  attributes:
    label: Issue reproduction
    description: Describe how to reproduce your issue
  validations:
    required: true
- type: textarea
  attributes:
    label: Logs
    description: Go to `.minecraft/logs` and drag and drop the `latest.log` and `debug.log` file into this text field
